name: CHAU Restock Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: restock-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          python -m camoufox fetch

      - name: Run restock check
        env:
          DISCORD_WEBHOOK_POKEMON: ${{ secrets.DISCORD_WEBHOOK_POKEMON }}
          DISCORD_WEBHOOK_ONEPIECE: ${{ secrets.DISCORD_WEBHOOK_ONEPIECE }}
          DISCORD_WEBHOOK_POKEMON_PREORDER: ${{ secrets.DISCORD_WEBHOOK_POKEMON_PREORDER }}
          DISCORD_WEBHOOK_ONEPIECE_PREORDER: ${{ secrets.DISCORD_WEBHOOK_ONEPIECE_PREORDER }}
          DISCORD_WEBHOOK_DRAGONBALL: ${{ secrets.DISCORD_WEBHOOK_DRAGONBALL }}
          DISCORD_WEBHOOK_DRAGONBALL_PREORDER: ${{ secrets.DISCORD_WEBHOOK_DRAGONBALL_PREORDER }}
          DISCORD_WEBHOOK_MTG: ${{ secrets.DISCORD_WEBHOOK_MTG }}
          DISCORD_WEBHOOK_MTG_PREORDER: ${{ secrets.DISCORD_WEBHOOK_MTG_PREORDER }}
          DISCORD_WEBHOOK_YUGIOH: ${{ secrets.DISCORD_WEBHOOK_YUGIOH }}
          DISCORD_WEBHOOK_YUGIOH_PREORDER: ${{ secrets.DISCORD_WEBHOOK_YUGIOH_PREORDER }}
          DISCORD_WEBHOOK_POKEMON_30TH: ${{ secrets.DISCORD_WEBHOOK_POKEMON_30TH }}
          DISCORD_WEBHOOK_POKEMON_30TH_PREORDER: ${{ secrets.DISCORD_WEBHOOK_POKEMON_30TH_PREORDER }}
          DISCORD_WEBHOOK_POKEMON_30TH_ALL: ${{ secrets.DISCORD_WEBHOOK_POKEMON_30TH_ALL }}
          DISCORD_WEBHOOK_POKEMON_30TH_ALL_PREORDER: ${{ secrets.DISCORD_WEBHOOK_POKEMON_30TH_ALL_PREORDER }}
        run: python check.py

      - name: Persist state.json
        run: |
          git config user.name "chau-restock-bot"
          git config user.email "actions@users.noreply.github.com"
          # state.json ist reine, frisch berechnete Zustandsdaten aus DIESEM Lauf. Bei einem
          # Push-Konflikt (zwei Laeufe ueberschneiden sich trotz concurrency-Gruppe, siehe Memory
          # Duplikat-Bug 2026-09-17) wird NICHT versucht zu mergen (scheitert bei JSON meist an
          # Zeilenkonflikten) - stattdessen wird bei jedem Retry hart auf den neuesten origin/master
          # zurueckgesetzt und unsere frische Kopie von state.json einfach obendrauf committet.
          cp state.json /tmp/state_fresh.json
          git add state.json
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, retrying ($i/5) ..."
            git fetch origin master
            git reset --hard origin/master
            cp /tmp/state_fresh.json state.json
            git add state.json
            git diff --cached --quiet || git commit -m "Update state [skip ci]"
          done
          echo "Push failed after 5 retries" >&2
          exit 1
# touch Thu Sep 17 05:59:56 UTC 2026
